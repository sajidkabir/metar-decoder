[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metar-decoder"
version = "1.0.0"
description = "Decode METAR aviation weather reports into structured data and plain English"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sajid Kabir Saji" }]
requires-python = ">=3.10"
keywords = ["metar", "aviation", "weather", "decoder", "parser"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/sajidkabir/metar-decoder"
Repository = "https://github.com/sajidkabir/metar-decoder"
Issues = "https://github.com/sajidkabir/metar-decoder/issues"
Changelog = "https://github.com/sajidkabir/metar-decoder/blob/main/CHANGELOG.md"

[project.scripts]
metar = "metar_decoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metar_decoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
